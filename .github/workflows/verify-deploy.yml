# Confirms that Cloud Run actually serves the new code after a merge to main.
# Polls https://pizzadamac.com/api/version ({ version, revision }) until:
#   - version == package.json "version" of the pushed commit, and
#   - (on push) revision changed from the one live when this run started = a NEW deploy happened.
# Green run = deployed. Red run = not live after 20 minutes (check Cloud Build / Cloud Run).
# Manual run (Actions → Verify deploy → Run workflow): only checks that the version is live.
name: Verify deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to expect (e.g. 1.8.1). Empty = version in package.json on main'
        required: false

concurrency:
  group: verify-deploy
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Wait for the new version on pizzadamac.com
        env:
          URL: https://pizzadamac.com/api/version
          IN_VERSION: ${{ github.event.inputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          EXPECTED="${IN_VERSION:-$(node -p "require('./package.json').version")}"
          get() { curl -fsS -m 15 -H 'Cache-Control: no-cache' "$URL" 2>/dev/null || echo '{}'; }
          field() { node -e "try{const j=JSON.parse(process.argv[1]);console.log(j[process.argv[2]]||'')}catch(e){console.log('')}" "$1" "$2"; }

          START=$(get); OLD_REV=$(field "$START" revision)
          echo "Expecting version $EXPECTED (live at start: $(field "$START" version) / $OLD_REV)"

          for i in $(seq 1 40); do          # 40 x 30s = 20 minutes
            NOW=$(get); VER=$(field "$NOW" version); REV=$(field "$NOW" revision)
            if [ "$VER" = "$EXPECTED" ] && { [ "$EVENT" != "push" ] || [ "$REV" != "$OLD_REV" ] || [ "$i" -gt 1 -a -z "$OLD_REV" ]; }; then
              echo "### ✅ Deployed: v$VER is live (revision $REV)" >> "$GITHUB_STEP_SUMMARY"
              echo "Deployed: v$VER ($REV)"; exit 0
            fi
            echo "[$i] live=$VER rev=$REV — waiting..."
            sleep 30
          done
          echo "### ❌ v$EXPECTED is NOT live after 20 minutes (live: $VER / $REV)" >> "$GITHUB_STEP_SUMMARY"
          echo "::error::v$EXPECTED not live after 20 minutes (live: $VER / $REV). Check Cloud Build history / Cloud Run revisions."
          exit 1
